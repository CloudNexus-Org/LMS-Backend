<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Payment</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body{
            font-family: Arial, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f5f5f5;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
            width:350px;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:12px;
            background:#3399cc;
            color:white;
            border:none;
            cursor:pointer;
            font-size:16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Pay with Razorpay</h2>

    <input type="number" id="amount" placeholder="Enter Amount">

    <input type="text" id="currency" value="INR">

    <button onclick="payNow()">Pay Now</button>
</div>

<script>

    async function payNow() {

        const amount = document.getElementById("amount").value;
        const currency = document.getElementById("currency").value;

        try {

            const response = await fetch(
                `http://localhost:8080/api/payment/create-order?amount=${amount}&currency=${currency}`,
                {
                    method: "POST"
                }
            );

            const order = await response.json();

            var options = {
                key: "rzp_test_SzXzzzKGln8oHA",

                amount: order.amount,

                currency: order.currency,

                name: "Food Ordering App",

                description: "Food Order Payment",

                order_id: order.id,

                handler: async function (response) {
                    try {
                        const verifyResponse = await fetch(
                            `http://localhost:8080/api/payment/verify-payment?payment_id=${response.razorpay_payment_id}&order_id=${response.razorpay_order_id}&signature=${response.razorpay_signature}`,
                            {
                                method: "POST"
                            }
                        );

                        const verifyResult = await verifyResponse.json();

                        if (verifyResponse.ok && verifyResult.status === "success") {
                            alert("Payment Successful & Verified!");
                            console.log("Verification successful:", verifyResult);
                        } else {
                            alert("Payment verification failed: " + verifyResult.message);
                        }
                    } catch (error) {
                        console.error("Verification error:", error);
                        alert("Payment Verification Failed");
                    }
                },

                prefill: {
                    name: "Customer",
                    email: "customer@gmail.com",
                    contact: "9999999999"
                },

                theme: {
                    color: "#3399cc"
                }
            };

            var rzp = new Razorpay(options);

            rzp.open();

        } catch (error) {
            console.error(error);
            alert("Payment Failed");
        }
    }

</script>

</body>
</html>
