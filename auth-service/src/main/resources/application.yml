server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/lms_auth
    username: ${POSTGRES_USER:lms_admin}
    password: ${POSTGRES_PASSWORD:lms_secret}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: auth-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:change-me-in-production-use-at-least-32-chars}
  access-expiry: ${JWT_ACCESS_EXPIRY:15m}
  refresh-expiry: ${JWT_REFRESH_EXPIRY:7d}
  remember-me-refresh-expiry: ${JWT_REMEMBER_ME_REFRESH_EXPIRY:30d}

auth:
  otp:
    length: 6
    expiry-minutes: 5
  login:
    max-attempts: 5
    lock-minutes: 15
  dev:
    # Return OTP in API responses for local/dev (no SMTP). Set AUTH_DEV_EXPOSE_OTP=false in production.
    expose-otp: ${AUTH_DEV_EXPOSE_OTP:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
